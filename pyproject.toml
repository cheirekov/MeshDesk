[project]
name = "meshdesk"
version = "0.1.0"
description = "Local Linux UI for Meshtastic devices over native TCP or Bluetooth LE"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "meshtastic==2.7.8",
  "pexpect>=4.9,<5",
  "pypubsub>=4.0,<5",
  "uvicorn[standard]>=0.34,<1",
  "zeroconf>=0.147,<1",
]

[project.scripts]
meshdesk = "meshdesk.__main__:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meshdesk"]
